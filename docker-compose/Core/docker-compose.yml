# name: core
services:

  postgres:
    # Recommended: Pin to a specific version
    # https://github.com/FerretDB/documentdb/pkgs/container/postgres-documentdb
    image: ghcr.io/ferretdb/postgres-documentdb:16-0.105.0-ferretdb-2.4.0
    restart: always
    # ports:
    #   - 5432:5432
    environment:
      POSTGRES_USER: ${KOMODO_DB_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers

  ferretdb:
    # Recommended: Pin to a specific version
    # https://github.com/FerretDB/FerretDB/pkgs/container/ferretdb
    image: ghcr.io/ferretdb/ferretdb:2.7.0
    restart: always
    depends_on:
      - postgres
    # ports:
    #   - 27017:27017
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DB_USERNAME}:${KOMODO_DB_PASSWORD}@postgres:5432/postgres
    volumes:
      - ferretdb-state:/state
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers

  core:
    image: ghcr.io/moghtech/komodo-core:2.3.4
    restart: always
    init: true
    depends_on:
      - ferretdb
    ports:
      - 9120:9120
    environment:
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
    volumes:
      ## Store dated backups of the database - https://komo.do/docs/setup/backup
      - ${MOUNT_POINT_DATA}/komodo/backups:/backups
      ## Attach the Core / Periphery communication keys
      - ${MOUNT_POINT_DATA}/komodo/keys:/config/keys
      ## Store sync files on server
      # - /path/to/syncs:/syncs
      ## Optionally mount a custom core.config.toml
      # - /path/to/core.config.toml:/config/config.toml
    ## Allows for systemd Periphery connection at
    ## "http://host.docker.internal:8120"
    # extra_hosts:
    #   - host.docker.internal:host-gateway
    labels:
      # KOMODO
      komodo.skip: "" # Prevent Komodo from stopping with StopAllContainers
      # HOMEPAGE
      homepage.group: Servers Management
      homepage.name: Komodo
      homepage.icon: komodo.png
      homepage.href: https://komodo.${DOMAIN_NAME}
      homepage.description: Komodo core service
      homepage.widget.type: komodo
      homepage.widget.url: https://komodo.${DOMAIN_NAME}
      homepage.widget.key: "${KOMODO_WIDGET_KEY}"
      homepage.widget.secret: "${KOMODO_WIDGET_SECRET}"
      # GODOXY
      proxy.aliases: komodo
      proxy.komodo.port: 9120

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.4
    restart: always
    ports:
      - 8120:8120
    volumes:
      ## Attach the Core / Periphery communication keys
      - keys:/config/keys
      ## Mount external docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      ## Allow Periphery to see processes outside of container
      - /proc:/proc
      ## Specify the Periphery agent root directory.
      ## Must be the same inside and outside the container,
      ## or docker will get confused. See https://github.com/moghtech/komodo/discussions/180.
      ## Default: /etc/komodo.
      - ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}
      ## Optionally mount a custom core.config.toml
      # - /path/to/periphery.config.toml:/config/config.toml
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers

volumes:
  # Postgres
  postgres-data:
  # FerretDB
  ferretdb-state:
  # Core / Periphery
  keys:
# networks:
#   proxy:
#     external: true
